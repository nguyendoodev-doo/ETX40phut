<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cài đặt Task KPI</title>  <link rel="stylesheet" crossorigin href="/assets/options-DO6w_uco.css">
</head><body><main><h1>Cài đặt Task KPI</h1><p>KPI được lưu theo phút và áp dụng ngay cho popup lẫn panel.</p><form id="form"><label>Chủ động (phút)<input id="activeTarget" type="number" min="0" required></label><label>Bị động (phút)<input id="passiveTarget" type="number" min="0" required></label><label class="check"><input id="showOverlay" type="checkbox"> Hiển thị panel trên website</label><label class="check"><input id="showPrediction" type="checkbox"> Hiển thị dự đoán giờ đạt KPI</label><label class="check"><input id="notificationsEnabled" type="checkbox"> Bật thông báo khi vừa đạt KPI</label><button type="submit">Lưu cài đặt</button><span id="message"></span></form><aside><b>Lưu ý:</b> MVP đang dùng mock data. Đổi <code>USE_MOCK_DATA</code> trong <code>src/config.js</code> sau khi cấu hình selector thật.</aside></main><script src="../config.js"></script><script src="../utils/storage.js"></script><script src="options.js"></script></body></html>
